# 时间窗口：“不要超过半个月” 
window_days: 15  #如果每周连续运行一般以7天为窗口，这里先设置和hard_cap_days一致
hard_cap_days: 15 #最早时间（用于筛掉过早的新闻）

sources:
  miit_home:
    name: 工业和信息化部
    url: https://www.miit.gov.cn/

  gov_latest_policy_rss:
    name: 中国政府网
    rss: https://rsshub.app/gov/zhengce/zuixin

  gov_home: 
    name: 中国政府网
    url: https://www.gov.cn/

  qqnews_search:
    name: 腾讯新闻
    url: https://i.news.qq.com/gw/pc_search/result
    # 支持多关键词查询，可在此处添加更多公众号或关键词
    queries: 
      - 工信微报

    max_pages: 5  #最多查询的页面
    page_size: 20 # 每页条数


# 微博监控数据源（调用 weibo_monitor.py，需要 Playwright）
# 启用前请先安装：pip install playwright && python -m playwright install chromium
weibo_monitor:
  enabled: false      # 设为 true 启用微博/官网数据源
  # mode 可选值：
  #   all          - 同时抓取微博账号和官网（默认）
  #   weibo_only   - 仅抓取微博账号，跳过官网
  #   website_only - 仅抓取官网新闻，跳过微博账号（速度更快，推荐优先启用）
  mode: website_only
  max_pages: 2        # 每个微博账号最多抓取的页数（仅 mode=all/weibo_only 时有效）

resolve_pub_date: True
resolve_pub_date_cap: 30

output:
  csv_path: docs/data/policy_news.csv 

# 可选：写入 Google Sheets
google_sheets:
  enabled: false
  spreadsheet_id: ""   # 建议用 GitHub Secrets 注入
  worksheet_name: "政策新闻"
