<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>政策新闻（policy_news.csv）</title>

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-dt@2.1.8/css/dataTables.dataTables.min.css">

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 24px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .meta { color: #555; margin-bottom: 16px; }
    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .btn { border: 1px solid #d0d7de; background: #f6f8fa; color: #24292f; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .btn:hover { background: #eef2f6; }
    .btn.active { border-color: #0969da; background: #ddf4ff; color: #0550ae; }
    .updated-at { color: #444; font-size: 13px; }
    .hint { color: #666; font-size: 12px; margin-top: 8px; }
    table { width: 100%; }
    .nowrap { white-space: nowrap; }
    #tbl td.title-col a,
    #tbl td.title-col span {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: bottom;
    }
  </style>
</head>
<body>
  <h1>政策新闻列表</h1>
  <div class="meta">
    数据源：<code>docs/data/policy_news.csv</code>
    <span id="status" style="margin-left:12px;">加载中…</span>
  </div>

  <div class="toolbar">
    <button id="miitFilterBtn" class="btn" type="button">仅看工信新闻</button>
    <span id="updatedAt" class="updated-at">数据更新时间：加载中…</span>
  </div>

  <table id="tbl" class="display">
    <thead>
      <tr>
        <th>标题</th>
        <th class="nowrap">发布单位</th>
        <th class="nowrap">发布日期</th>
        <th class="nowrap">来源</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="hint">
    支持：搜索、排序、分页。标题点击可打开原文链接。
  </div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/datatables.net@2.1.8/js/dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    const CSV_PATH = "./data/policy_news.csv";
    let onlyMiitNews = false;
    let table = null;

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function truncateText(s, maxLen) {
      const str = String(s ?? "").trim();
      if (str.length <= maxLen) return str;
      return `${str.slice(0, maxLen)}...`;
    }

    function getLatestTime(times) {
      const valid = (times || []).map(t => String(t || "").trim()).filter(Boolean);
      if (!valid.length) return "未知";
      return valid.reduce((latest, current) => (current.localeCompare(latest, "zh-CN") > 0 ? current : latest));
    }

    async function loadCsv() {
      const statusEl = document.getElementById("status");
      const updatedAtEl = document.getElementById("updatedAt");
      const miitFilterBtn = document.getElementById("miitFilterBtn");

      $.fn.dataTable.ext.search.push(function(settings, data) {
        if (settings.nTable.id !== "tbl") return true;
        if (!onlyMiitNews) return true;
        const sourceText = data[3] || "";
        return sourceText.includes("工信");
      });

      miitFilterBtn.addEventListener("click", function() {
        onlyMiitNews = !onlyMiitNews;
        miitFilterBtn.classList.toggle("active", onlyMiitNews);
        miitFilterBtn.textContent = onlyMiitNews ? "仅看工信新闻（已开启）" : "仅看工信新闻";
        if (table) table.draw();
      });

      try {
        const resp = await fetch(CSV_PATH, { cache: "no-store" });
        if (!resp.ok) throw new Error(`HTTP ${resp.status} ${resp.statusText}`);
        const csvText = await resp.text();

        const parsed = Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true
        });

        if (parsed.errors?.length) {
          console.warn("CSV parse warnings:", parsed.errors);
        }

        // 你的CSV列名（根据你当前流程）：标题, 发布单位, 新闻URL, 发布日期, 来源, 查询时间
        const rows = (parsed.data || []).map(r => {
          const title = r["标题"] || "";
          const url = r["新闻URL"] || "";
          const publisher = r["发布单位"] || "";
          const pubDate = r["发布日期"] || "";
          const source = r["来源"] || "";
          const fetchedAt = r["查询时间"] || "";

          const isWeibo = String(source).includes("微博");
          const displayTitle = isWeibo ? truncateText(title, 34) : title;

          const titleCell = url
            ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(title)}">${escapeHtml(displayTitle)}</a>`
            : `<span title="${escapeHtml(title)}">${escapeHtml(displayTitle)}</span>`;

          return [titleCell, escapeHtml(publisher), escapeHtml(pubDate), escapeHtml(source), escapeHtml(fetchedAt)];
        });

        const latestFetchedAt = getLatestTime(rows.map(row => row[4]));
        updatedAtEl.textContent = `数据更新时间：${latestFetchedAt}`;

        // 初始化 DataTable
        table = $("#tbl").DataTable({
          data: rows.map(row => row.slice(0, 4)),
          columns: [
            { title: "标题", width: "55%", className: "title-col" },
            { title: "发布单位", width: "17%", className: "nowrap" },
            { title: "发布日期", width: "14%", className: "nowrap" },
            { title: "来源", width: "14%", className: "nowrap" }
          ],
          pageLength: 50,
          order: [[2, "desc"]], // 默认按发布日期降序
          autoWidth: false,
          deferRender: true
        });

        statusEl.textContent = `加载完成（${rows.length} 条）`;
      } catch (e) {
        console.error(e);
        statusEl.textContent = "加载失败，请检查 CSV 路径与 Pages 设置。";
        updatedAtEl.textContent = "数据更新时间：加载失败";
        alert("加载 CSV 失败：" + e.message);
      }
    }

    loadCsv();
  </script>
</body>
</html>
