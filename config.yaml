    url: https://www.miit.gov.cn/

  gov_latest_policy_rss:
    name: 中国政府网
    rss: https://rsshub.app/gov/zhengce/zuixin

  gov_home:
    name: 中国政府网
    url: https://www.gov.cn/

  ndrc_home:
    name: 国家发展和改革委员会
    url: https://www.ndrc.gov.cn/

  most_home:
    name: 科学技术部
    url: https://www.most.gov.cn/

  moe_news:
    name: 教育部
    url: http://www.moe.gov.cn/jyb_xwfb/

  miit_local:
    name: 地方工信部门
    enabled: true

  gov_local:
    name: 地方政府门户
    enabled: true

  qqnews_search:
    name: 腾讯新闻
    url: https://i.news.qq.com/gw/pc_search/result
    # 支持多关键词查询，可在此处添加更多公众号或关键词
    queries:
      - 工信微报

    max_pages: 5  #最多查询的页面
    page_size: 20 # 每页条数

  sasac_home:
    name: 国务院国有资产监督管理委员会
    url: http://www.sasac.gov.cn/

  nda_home:
    name: 国家数据局
    url: https://www.nda.gov.cn/sjj/index_pc.html

  soe:
    name: 中央企业
    enabled: true
    soe_timeout: 5


# 微博/官网监控数据源（需要 Playwright，配置项由 parsers/weibo.py 和 parsers/website_monitor.py 读取）
weibo_monitor:
  enabled: true      # 设为 true 启用微博/官网数据源
  # mode 可选值：
  #   all          - 同时抓取微博账号和官网（默认）
  #   weibo_only   - 仅抓取微博账号，跳过官网
  #   website_only - 仅抓取官网新闻，跳过微博账号（速度更快，推荐优先启用）
  mode: all
  max_pages: 1        # 每个微博账号最多抓取的页数（仅 mode=all/weibo_only 时有效）

resolve_pub_date: True
resolve_pub_date_cap: 30

# ─────────────────────────────────────────────────────────────────────────────
# 发布单位别名表（publisher_alias）
#
# 用途：CSV 入库时把同一机构的不同写法归一到 value 指定的"标准名"，
#       以保证统计/筛选/去重时不会因为简称/全称差异而被视为不同来源。
#
# 设计原则：
#   1. 仅收录"严格等价的命名变体"——同一法人 / 同一官方机构的不同写法；
#   2. 不混合官微账号与对应部委（官微面向公众、与政策原文受众不同，保留分离）；
#   3. key 必须与抓取入库时 storage.py 写入的 发布单位 字段一致（区分简繁/大小写）。
# ─────────────────────────────────────────────────────────────────────────────
publisher_alias:
  # 国家发改委：官网新闻里两种写法同时存在
  "国家发展改革委": "国家发展和改革委员会"
  # 广东省政府缩写
  "广东省政府": "广东省人民政府"

output:
  csv_path: docs/data/policy_news.csv 
